<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Quiz · Host</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { overflow: hidden; }
  [hidden] { display: none !important; }
  .screen { display: none; height: 100vh; flex-direction: column; padding: 2.5vh 3vw; gap: 2vh; }
  .screen.on { display: flex; }
  .center { align-items: center; justify-content: center; text-align: center; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px; width: min(440px, 92vw); display: grid; gap: 14px; }
  .mute { position: fixed; top: 1.2vh; right: 1.2vw; z-index: 50; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; width: 5vh; height: 5vh; min-width: 40px; min-height: 40px; font-size: 2.6vh; cursor: pointer; opacity: .7; }
  .mute:hover { opacity: 1; }
  /* lobby */
  .lobby-top { display: flex; gap: 4vw; align-items: center; justify-content: center; }
  .qr { background: #fff; padding: 12px; border-radius: 16px; width: 30vh; height: 30vh; }
  .pinbox { text-align: left; }
  .pinbox .lbl { font-size: 2.4vh; color: var(--muted); }
  .pin { font: 800 14vh/1 var(--mono); letter-spacing: .05em; color: var(--accent); }
  .url { font: 2.2vh var(--mono); color: var(--muted); }
  .names { flex: 1; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; justify-content: center; overflow: hidden; }
  .names span { background: var(--panel); border: 1px solid var(--line); padding: 8px 16px; border-radius: 999px; font-size: 2.4vh; animation: pop .25s ease-out; cursor: pointer; }
  .names span.arm { background: #b0142f; border-color: #ff6b6b; }
  .names span.arm::after { content: " ✕ remove?"; font-weight: 700; }
  .hint { font-size: 1.8vh; color: var(--muted); text-align: center; }
  @keyframes pop { from { transform: scale(.6); opacity: 0 } }
  .bar { display: flex; justify-content: space-between; align-items: center; font-size: 2.6vh; gap: 2vw; }
  #s-q .bar { padding-right: max(4vw, 48px); }   /* room for the sound button */
  /* question */
  .qtext { font-size: 5vh; font-weight: 700; text-align: center; background: var(--panel); border-radius: 16px; padding: 3vh 3vw; }
  .dbl { background: linear-gradient(90deg, #ffb800, #ff5e00); color: #000; font-weight: 800; padding: .6vh 1.6vw; border-radius: 999px; animation: pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.08); } }
  .fact { font-size: 3vh; background: #10251a; border: 1px solid var(--accent); border-radius: 14px; padding: 1.6vh 2vw; text-align: center; animation: pop .4s ease-out; }
  .mid { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: space-between; }
  .timer { width: 18vh; height: 18vh; border-radius: 50%; display: grid; place-items: center; font: 800 8vh var(--mono); background: var(--accent); color: #000; flex: none; }
  .timer.low { background: #ff4d4d; animation: pulse .5s ease-in-out infinite alternate; }
  .pct { width: 24vh; text-align: center; font-size: 2.6vh; font-weight: 700; animation: pop .4s ease-out; }
  .pct b { display: block; font: 800 9vh/1 var(--mono); color: var(--accent); }
  .count { text-align: center; font-size: 3vh; } .count b { display: block; font-size: 8vh; }
  .chart { display: flex; gap: 2vw; align-items: flex-end; height: min(26vh, 100%); }
  .col { width: 9vw; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font: 700 3.4vh var(--mono); }
  .col i { display: block; width: 100%; border-radius: 8px 8px 0 0; min-height: 6px; transition: height .6s; }
  .col.wrong { opacity: .3; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6vh; }
  .tile { border-radius: 12px; padding: 2.6vh 2vw; font-size: 3.6vh; font-weight: 700; display: flex; align-items: center; gap: 1.6vw; color: #fff; }
  .tile.dim { opacity: .25; } .tile.right::after { content: "✔"; margin-left: auto; }
  /* leaderboard / podium */
  .board { width: min(900px, 90vw); display: grid; gap: 1.4vh; }
  .row { display: flex; align-items: center; gap: 1.2vw; background: var(--panel); border-radius: 12px; padding: 2vh 2vw; font-size: 3.6vh; font-weight: 700; animation: slide .45s ease-out backwards; }
  .row:first-child { background: var(--accent); color: #000; }
  .row .nm { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row b { font-family: var(--mono); }
  .mv { font: 700 2.6vh var(--mono); min-width: 6vh; }
  .mv.up { color: #39ff88; } .mv.down { color: #ff6b6b; }
  .row:first-child .mv.up { color: #064d22; } .row:first-child .mv.down { color: #7a0012; }
  .kick { background: transparent; border: 0; color: inherit; opacity: .35; font-size: 2.6vh; cursor: pointer; padding: 0 .4vw; }
  .kick:hover { opacity: 1; }
  @keyframes slide { from { transform: translateY(6vh); opacity: 0 } }
  .podium { display: flex; align-items: flex-end; gap: 2vw; height: 40vh; }
  .step { width: 20vw; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; animation: rise .8s ease-out backwards; }
  .step div { width: 100%; border-radius: 12px 12px 0 0; display: grid; place-items: center; font: 800 7vh var(--mono); color: #000; }
  .step .nm { font-size: 4vh; font-weight: 800; } .step .sc { font: 2.8vh var(--mono); color: var(--muted); margin-bottom: 1vh; }
  @keyframes rise { from { transform: translateY(40vh); opacity: 0 } }
  .finalx { display: flex; gap: 3vw; align-items: flex-start; justify-content: center; animation: pop .5s ease-out backwards; }
  .rest { display: grid; grid-template-columns: auto auto; gap: .6vh 2.4vw; font-size: 2.4vh; text-align: left; }
  .rest b { font-family: var(--mono); color: var(--muted); font-weight: 400; }
  .awards { display: grid; gap: 1vh; }
  .awards h3 { margin: 0; font-size: 2.2vh; color: var(--muted); font-weight: 600; }
  .award { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 1.2vh 1.6vw; font-size: 2.6vh; text-align: left; }
  .award span { color: var(--muted); font-size: 2.1vh; }
  h1.title { font-size: 6vh; margin: 0; }
  .sponsor { font-size: 2.6vh; }
</style>
</head>
<body>
<button class="mute" id="mute" title="Sound on/off (M)">🔊</button>

<!-- 1. login -->
<section id="s-login" class="screen on center">
  <div class="card">
    <h2 style="margin:0">Host a game</h2>
    <input id="key" type="password" placeholder="Host password" autocomplete="current-password">
    <button class="btn" id="loadEvents">Unlock</button>
    <select id="event" hidden></select>
    <button class="btn" id="create" hidden>Create game</button>
    <div id="err" class="err"></div>
    <a href="/editor.html" style="color:var(--muted);font-size:14px">Edit questions</a>
  </div>
</section>

<!-- 2. lobby -->
<section id="s-lobby" class="screen">
  <img class="evlogo" id="lobbyLogo" alt="" hidden>
  <h1 class="title center" id="lobbyTitle" style="display:flex"></h1>
  <div class="lobby-top">
    <img class="qr" id="qr" alt="Scan to join">
    <div class="pinbox">
      <div class="lbl">Scan the code, or go to</div>
      <div class="url" id="joinUrl"></div>
      <div class="lbl" style="margin-top:2vh">Game PIN</div>
      <div class="pin" id="pin"></div>
    </div>
  </div>
  <div class="names" id="names"></div>
  <div class="hint">Click a name twice to remove that player</div>
  <div class="bar"><span><b id="pcount">0</b> players</span><a data-sponsor></a><button class="btn" id="start">Start ▶</button></div>
</section>

<!-- 3. question / reveal -->
<section id="s-q" class="screen">
  <div class="bar"><span id="qnum"></span><span class="dbl" id="dbl" hidden>⚡ DOUBLE POINTS</span><button class="btn ghost" id="skip">Skip ⏭</button></div>
  <div class="qtext" id="qtext"></div>
  <div class="fact" id="fact" hidden></div>
  <div class="mid">
    <div class="timer" id="timer"></div>
    <div class="pct" id="pct" hidden></div>
    <div class="chart" id="chart"></div>
    <div class="count"><b id="acount">0</b>answers</div>
  </div>
  <div class="tiles" id="tiles"></div>
</section>

<!-- 4. leaderboard -->
<section id="s-board" class="screen center">
  <img class="evlogo" data-logo alt="" hidden>
  <h1 class="title">Scoreboard</h1>
  <div class="board" id="board"></div>
  <button class="btn" id="next">Next ▶</button>
  <a data-sponsor></a>
</section>

<!-- 5. final -->
<section id="s-final" class="screen center">
  <img class="evlogo" data-logo alt="" hidden>
  <h1 class="title" id="finalTitle">Winners</h1>
  <div class="podium" id="podium"></div>
  <div class="finalx" id="finalx"><div class="rest" id="rest"></div><div class="awards" id="awards"></div></div>
  <div style="display:flex;gap:16px">
    <a class="btn ghost" id="csv" href="#">Download check-ins (CSV)</a>
    <button class="btn ghost" id="again">New game</button>
  </div>
  <a data-sponsor></a>
</section>

<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script src="/sfx.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const socket = io();
handleIdle(socket);
let key = '', pin = '', total = 0, qi = -1, timerInt = null, lastReveal = null, lastCount = 0;
const show = (id) => document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
const store = (k, v) => { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} };
const load = (k) => { try { return sessionStorage.getItem(k); } catch { return null; } };
const fmt = (n) => Number(n).toLocaleString();
const next = (act) => socket.emit('host:next', { act, q: qi });

// ---- sound ----
const paintMute = () => { $('mute').textContent = Sfx.muted ? '🔇' : '🔊'; };
paintMute();
$('mute').onclick = (e) => { e.stopPropagation(); Sfx.unlock(); Sfx.setMuted(!Sfx.muted); paintMute(); };
addEventListener('pointerdown', () => Sfx.unlock());
addEventListener('keydown', (e) => {
  Sfx.unlock();
  if ((e.key === 'm' || e.key === 'M') && e.target.tagName !== 'INPUT') $('mute').click();
});

// ---- login ----
$('loadEvents').onclick = async () => {
  key = $('key').value; $('err').textContent = '';
  const r = await fetch('/api/events', { headers: { 'x-host-key': key } });
  if (!r.ok) return $('err').textContent = 'Wrong password';
  const evs = await r.json();
  $('event').innerHTML = evs.map(e => `<option value="${esc(e.id)}">${esc(e.title)} (${e.questions} Qs) - ${esc(e.id)}</option>`).join('');
  $('event').hidden = $('create').hidden = false; $('loadEvents').hidden = $('key').hidden = true;
};
$('key').onkeydown = (e) => e.key === 'Enter' && $('loadEvents').click();
$('create').onclick = () => socket.emit('host:create', { key, eventId: $('event').value }, (r) => {
  if (r.error) return $('err').textContent = r.error;
  enterLobby(r);
});
function enterLobby(r) {
  pin = r.pin; total = r.total; qi = r.qIndex ?? -1; store('hostKey', key); store('hostPin', pin);
  document.querySelectorAll('#lobbyLogo, [data-logo]').forEach(img => { img.hidden = !r.logo; if (r.logo) img.src = r.logo; });
  $('lobbyTitle').textContent = r.title; $('pin').textContent = pin.replace(/(\d{3})(\d{3})/, '$1 $2');
  $('qr').src = `/api/qr/${pin}.png`; $('joinUrl').textContent = `${location.host}/play.html?pin=${pin}`;
  $('csv').href = `/api/registrations.csv?key=${encodeURIComponent(key)}`;
  show('s-lobby'); Sfx.loop('lobby');
}
// Survive a refresh mid-game: the server sends the current question / reveal / results right after this.
const savedPin = load('hostPin');
if (savedPin) socket.emit('host:rejoin', { key: load('hostKey'), pin: savedPin }, (r) => {
  if (r.error) return store('hostPin', null);
  key = load('hostKey'); enterLobby(r);
});

// ---- lobby ----
socket.on('lobby', ({ count, names }) => {
  if (count > lastCount && $('s-lobby').classList.contains('on')) Sfx.join();
  lastCount = count;
  $('pcount').textContent = count;
  $('names').innerHTML = names.map(n => `<span data-name="${esc(n)}">${esc(n)}</span>`).join('');
});
// Two clicks to remove: first click arms the chip (turns red), second click kicks. Clicking elsewhere disarms.
$('names').onclick = (e) => {
  const chip = e.target.closest('span[data-name]'); if (!chip) return;
  if (chip.classList.contains('arm')) return socket.emit('host:kick', { name: chip.dataset.name });
  $('names').querySelectorAll('.arm').forEach(c => c.classList.remove('arm'));
  chip.classList.add('arm');
  setTimeout(() => chip.classList.remove('arm'), 4000);
};
$('start').onclick = () => next('advance');

// ---- question ----
socket.on('question', (q) => {
  qi = q.index; lastReveal = null;
  $('qnum').textContent = `Question ${q.index + 1} of ${q.total}`;
  $('dbl').hidden = !q.double;
  $('qtext').textContent = q.q; $('acount').textContent = 0; $('chart').innerHTML = '';
  $('fact').hidden = true; $('pct').hidden = true;
  $('timer').hidden = false; $('timer').classList.remove('low'); $('skip').textContent = 'Skip ⏭';
  $('tiles').innerHTML = q.answers.map((a, i) =>
    `<div class="tile" style="background:${COLORS[i]}">${SHAPES[i]}<span>${esc(a)}</span></div>`).join('');
  let left = q.time; $('timer').textContent = left;
  clearInterval(timerInt);
  if (left > 0) {
    Sfx.loop('think');
    timerInt = setInterval(() => {
      left = Math.max(0, left - 1); $('timer').textContent = left;
      if (left <= 5) { $('timer').classList.add('low'); if (left) Sfx.tick(left === 1); }
      if (!left) { clearInterval(timerInt); Sfx.loop(null); Sfx.timeUp(); }
    }, 1000);
  }
  show('s-q');
});
socket.on('answered', ({ answered }) => $('acount').textContent = answered);
const pctLabel = (p) => p <= 25 ? 'got it right. Ouch!' : p >= 80 ? 'nailed it' : 'got it right';
socket.on('reveal', (r) => {
  clearInterval(timerInt); lastReveal = r; Sfx.loop(null); Sfx.reveal();
  $('timer').hidden = true; $('acount').textContent = r.answered;
  if (r.answered) { $('pct').innerHTML = `<b>${r.pct}%</b>${pctLabel(r.pct)}`; $('pct').hidden = false; }
  if (r.fact) { $('fact').textContent = '💡 ' + r.fact; $('fact').hidden = false; }
  const max = Math.max(1, ...r.counts);
  $('chart').innerHTML = r.counts.map((c, i) =>
    `<div class="col ${i === r.correct ? '' : 'wrong'}">${c}<i style="background:${COLORS[i]};height:0"></i></div>`).join('');
  requestAnimationFrame(() => [...$('chart').querySelectorAll('i')].forEach((el, i) => el.style.height = (r.counts[i] / max * 85) + '%'));
  [...$('tiles').children].forEach((t, i) => t.classList.add(i === r.correct ? 'right' : 'dim'));
  $('skip').textContent = 'Scoreboard ▶';
  show('s-q');
});
$('skip').onclick = () => {
  if (!lastReveal) return next('reveal');            // ends question early
  const mv = (m) => m > 0 ? `<span class="mv up">▲${m}</span>` : m < 0 ? `<span class="mv down">▼${-m}</span>` : '<span class="mv"></span>';
  $('board').innerHTML = lastReveal.leaderboard.map((p, i) =>
    `<div class="row" style="animation-delay:${(lastReveal.leaderboard.length - i) * .12}s"><span>${p.rank}.</span><span class="nm">${esc(p.name)}</span>
     ${mv(p.moved)}<b>${fmt(p.score)}</b><button class="kick" data-name="${esc(p.name)}" title="Remove player">✕</button></div>`).join('');
  $('next').textContent = lastReveal.last ? 'Final results 🏆' : 'Next question ▶';
  show('s-board');
};
// Scoreboard ✕: removing mid-game needs a second click within 4 seconds.
$('board').onclick = (e) => {
  const b = e.target.closest('.kick'); if (!b) return;
  if (b.dataset.armed) { socket.emit('host:kick', { name: b.dataset.name }); b.closest('.row').remove(); return; }
  b.dataset.armed = 1; b.textContent = 'remove?'; b.style.opacity = 1;
  setTimeout(() => { delete b.dataset.armed; b.textContent = '✕'; b.style.opacity = ''; }, 4000);
};
$('next').onclick = () => next('advance');

// ---- final ----
socket.on('final', ({ podium, awards = [] }) => {
  clearInterval(timerInt); Sfx.loop(null);
  const ROLL = 1.8;   // seconds of drumroll before the podium rises
  Sfx.drumroll(ROLL); Sfx.fanfare(ROLL + 1.2);
  const order = [1, 0, 2], h = ['24vh', '32vh', '17vh'], col = ['#c0c0c0', 'var(--accent)', '#cd7f32'];
  $('podium').innerHTML = order.filter(i => podium[i]).map((i) => {
    const k = order.indexOf(i);
    return `<div class="step" style="animation-delay:${ROLL + [.6, 1.2, 0][k]}s"><span class="nm">${esc(podium[i].name)}</span>
     <span class="sc">${fmt(podium[i].score)} pts</span><div style="height:${h[k]};background:${col[k]}">${podium[i].rank}</div></div>`;
  }).join('');
  $('rest').innerHTML = podium.slice(3).map(p => `<span>${p.rank}. ${esc(p.name)}</span><b>${fmt(p.score)}</b>`).join('');
  $('awards').innerHTML = awards.length ? '<h3>Bonus prizes (outside the top 3)</h3>' + awards.map(a =>
    `<div class="award">${a.emoji} <b>${esc(a.title)}</b>: ${esc(a.name)} <span>· ${esc(a.detail)}</span></div>`).join('') : '';
  $('finalx').style.animationDelay = (ROLL + 2) + 's';
  $('finalx').hidden = !(podium.length > 3 || awards.length);
  store('hostPin', null); show('s-final');
});
$('again').onclick = () => { store('hostPin', null); location.reload(); };
</script>
</body>
</html>
